<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Complaint · Magdiwang Water</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/complaint.js"></script></head>
<body class="portal"><div class="portal-wrap">
<div class="portal-top"><span data-i18n="site"></span><button id="lang_toggle" class="btn" type="button"></button></div>
<h1 class="portal-title" data-i18n="c_title"></h1>
<p class="portal-sub" data-i18n="c_help"></p>
<form id="complaint_form" class="card" autocomplete="off">
  <div class="form-grid">
    <div class="field"><label for="first_name" data-i18n="first_name"></label><input id="first_name" maxlength="100" required></div>
    <div class="field"><label for="last_name" data-i18n="last_name"></label><input id="last_name" maxlength="100" required></div>
    <div class="field"><label for="barangay" data-i18n="barangay"></label><select id="barangay" required></select></div>
    <div class="field"><label for="meter_id" data-i18n="meter"></label><input id="meter_id" inputmode="numeric" pattern="[0-9]*" maxlength="10" required></div>
    <div class="field"><label for="category" data-i18n="category"></label><select id="category" required></select></div>
  </div>
  <div class="field"><label for="message" data-i18n="details"></label><textarea id="message" minlength="10" maxlength="1000" required></textarea>
    <span class="small muted" data-i18n="details_help"></span></div>
  <button id="send_btn" class="btn" type="submit" data-i18n="send"></button>
  <div id="complaint_msg" role="alert" hidden></div>
</form>
<div class="footer-links"><a href="/" data-i18n="back"></a></div>
</div></body></html>
