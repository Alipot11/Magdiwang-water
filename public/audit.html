<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit log · Magdiwang Water</title><link rel="stylesheet" href="/css/style.css"><script type="module" src="/js/audit.js"></script></head>
<body><header id="topbar"></header><main class="page">

<div class="page-head"><div><h1>Audit log</h1><p>Every change to bills, payments, clients and accounts. Read-only.</p></div></div>
<form id="filter_form" class="card row"><div><label for="meter">Meter number</label><input id="meter" inputmode="numeric" placeholder="Any"></div>
  <div><label for="action">Action</label><select id="action"><option value="">Any</option><option>CREATE</option><option>UPDATE</option><option>VOID</option><option>ACTIVATE</option><option>DEACTIVATE</option><option>SMS</option><option>BACKUP</option></select></div>
  <button class="btn" type="submit">Filter</button></form>
<div id="msg" role="alert" hidden></div><div id="list"></div>
<div class="row"><button id="prev" class="btn secondary" type="button">Previous</button><span id="page_info" class="muted"></span><button id="next" class="btn secondary" type="button">Next</button></div>
</main></body></html>
